name: DevSecOps CI Pipeline
on: [push, pull_request]
jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      
      - name: Install and Upgrade Dependencies
        run: |
          # Upgrade core Python tools to secure versions first
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          # Install project requirements and security tools
          pip install -r requirements-dev.txt

      - name: SAST (Bandit)
        run: bandit -r netguard -ll -ii
        
      - name: SCA (pip-audit)
        run: pip-audit

      - name: Tests (pytest)
        run: python -m pytest -q
